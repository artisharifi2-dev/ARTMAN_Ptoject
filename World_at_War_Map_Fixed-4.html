<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>World at War | فرمانروای جنگ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0f14;--panel:#141a22;--panel2:#1b232e;--panel3:#232d3b;--border:#2c3746;--gold:#c9a227;--txt:#dbe3ec;--dim:#8b97a7;--green:#3fa86a;--red:#c0392b;--blue:#2f6fd0;--orange:#d98324}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;font-size:14px;user-select:none}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,var(--panel3),var(--panel2));border:1px solid var(--border);color:var(--txt);padding:7px 12px;border-radius:6px;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:linear-gradient(180deg,#2d3949,#232d3b);border-color:#3d4a5c}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent}
.btn.gold{background:linear-gradient(180deg,#b8901f,#8a6b12);border-color:#c9a227;color:#111;font-weight:700}
.btn.green{background:linear-gradient(180deg,#2f8a55,#22683f);border-color:#3fa86a}
.btn.red{background:linear-gradient(180deg,#a52f22,#7e2118);border-color:#c0392b}
.btn.blue{background:linear-gradient(180deg,#2a63b8,#1f4a8b);border-color:#2f6fd0}
.btn.icon{padding:6px 10px;font-size:15px;line-height:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:4px 8px;font-size:12px}
#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 10%,#1a2740 0%,transparent 55%),radial-gradient(circle at 85% 85%,#2a1a1a 0%,transparent 55%),var(--bg);padding:16px;gap:12px;overflow:hidden}
.start-head{text-align:center;padding-top:8px}
.start-head h1{font-size:26px;letter-spacing:1px;color:var(--gold)}
.start-head h2{font-size:16px;font-weight:400;color:var(--dim);margin-top:2px}
.start-head .sub{font-size:12px;color:var(--dim);margin-top:6px}
.start-tools{display:flex;gap:8px;max-width:900px;width:100%;margin:0 auto}
#countrySearch{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:10px 14px;border-radius:8px;font-family:inherit;font-size:14px;outline:none}
#countrySearch:focus{border-color:var(--gold)}
.country-list{flex:1;overflow-y:auto;max-width:900px;width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:4px;align-content:start}
.c-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.15s}
.c-item:hover{border-color:var(--gold);background:var(--panel2);transform:translateY(-1px)}
.c-flag{font-size:20px;line-height:1}
.c-flag-fallback{width:24px;height:17px;border-radius:2px;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.c-name{font-size:13px;font-weight:600}
.c-meta{font-size:10.5px;color:var(--dim);margin-top:2px}
.start-foot{text-align:center;font-size:11px;color:#4b5666;padding-bottom:4px}
#game{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#182029,#10161d);border-bottom:2px solid var(--border);padding:6px 10px;flex-wrap:wrap;z-index:20}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px}
.tb-country{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;color:var(--gold)}
.tb-stats{display:flex;gap:12px;flex-wrap:wrap;flex:1;justify-content:center;font-size:12px}
.stat{display:flex;align-items:center;gap:4px;color:var(--dim)}
.stat b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
.stat.good b{color:var(--green)}
.stat.bad b{color:var(--red)}
.tb-date{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.speed-group{display:flex;gap:3px}
.btn.sp{padding:5px 9px;font-size:12px;min-width:34px}
.btn.sp.active{background:linear-gradient(180deg,#b8901f,#8a6b12);color:#111;border-color:#c9a227;font-weight:700}
#mapWrap{position:relative;overflow:hidden;background:#0a1622;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.grabbing{cursor:grabbing}
#map .country{stroke:#0b1118;stroke-width:.35;vector-effect:non-scaling-stroke;transition:fill .3s}
#map .country:hover{stroke:#f0d060;stroke-width:1.2}
#map .country.selected{stroke:#ffd54a;stroke-width:1.8}
.map-hint{position:absolute;bottom:8px;right:50%;transform:translateX(50%);font-size:11px;color:#5a6779;background:rgba(10,16,24,.75);padding:4px 12px;border-radius:20px;border:1px solid #1e2836;pointer-events:none;transition:opacity .6s}
#sidePanel{position:absolute;top:8px;left:8px;width:270px;max-height:calc(100% - 16px);overflow-y:auto;background:rgba(20,26,34,.96);border:1px solid var(--border);border-radius:10px;padding:12px;z-index:15;backdrop-filter:blur(6px);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.sp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp-head .flag{font-size:24px}
.sp-head h4{font-size:15px;color:var(--gold)}
.sp-head small{display:block;font-size:10px;color:var(--dim);font-weight:400}
.sp-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #222c38}
.sp-row span{color:var(--dim)}
.sp-row b{font-variant-numeric:tabular-nums}
.sp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sp-actions .btn{flex:1 1 45%;font-size:11.5px;padding:6px 4px;text-align:center}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.badge.war{background:#4a1a15;color:#ff8b7d;border:1px solid #7e2f24}
.badge.ally{background:#12361f;color:#6fdb9d;border:1px solid #2f7a4b}
.badge.neutral{background:#1e2733;color:#8b97a7;border:1px solid #2c3746}
.mini-log{position:absolute;bottom:8px;right:8px;width:250px;max-height:120px;overflow:hidden;font-size:10.5px;color:#7d8a9c;pointer-events:none;display:flex;flex-direction:column-reverse;gap:2px;text-align:left;direction:rtl}
.mini-log div{background:rgba(10,16,24,.7);padding:2px 8px;border-radius:4px;border-right:2px solid var(--gold);animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
#bottombar{display:flex;background:linear-gradient(180deg,#161d26,#0e141b);border-top:2px solid var(--border);overflow-x:auto;scrollbar-width:none}
#bottombar::-webkit-scrollbar{display:none}
.tabbtn{flex:1 0 auto;min-width:78px;background:transparent;border:none;border-left:1px solid #1e2733;color:var(--dim);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;transition:.15s}
.tabbtn span{font-size:17px}
.tabbtn:hover{background:var(--panel2);color:var(--txt)}
.tabbtn:active{background:var(--panel3)}
#modal{position:fixed;inset:0;background:rgba(4,7,11,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:10px;backdrop-filter:blur(3px)}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1b232e,#141a22);border-radius:12px 12px 0 0}
.modal-head h3{font-size:15px;color:var(--gold)}
.modal-body{padding:14px;overflow-y:auto;flex:1}
.sec{margin-bottom:16px}
.sec-title{font-size:12.5px;color:var(--gold);font-weight:700;margin-bottom:8px;border-right:3px solid var(--gold);padding-right:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px}
.card h5{font-size:12.5px;margin-bottom:5px;color:var(--txt)}
.card p{font-size:11px;color:var(--dim);line-height:1.6}
.card .row{display:flex;justify-content:space-between;padding:2px 0}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #232d3b;font-size:12.5px}
.kv span{color:var(--dim)}
.kv b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0d131a;border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6fd0,#4a9eff);border-radius:3px}
.bar.g>i{background:linear-gradient(90deg,#2f8a55,#4ecb85)}
.bar.r>i{background:linear-gradient(90deg,#a52f22,#e05a48)}
.bar.y>i{background:linear-gradient(90deg,#b8901f,#e0b93a)}
.tech-item{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:6px}
.tech-item .ti-icon{font-size:20px;width:28px;text-align:center}
.tech-item .ti-main{flex:1}
.tech-item .ti-name{font-size:12.5px;font-weight:700}
.tech-item .ti-sub{font-size:10.5px;color:var(--dim)}
.lvl{display:flex;gap:2px;margin-top:4px}
.lvl i{width:14px;height:5px;background:#2a3542;border-radius:2px}
.lvl i.on{background:var(--gold)}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px;gap:8px}
.list-item .li-name{flex:1;display:flex;align-items:center;gap:7px}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#233042;color:#9fb3c9}
.empty{text-align:center;color:#4f5c6d;font-size:12px;padding:22px 0}
.toast{position:fixed;bottom:76px;right:50%;transform:translateX(50%) translateY(20px);background:#1c2734;border:1px solid var(--gold);color:var(--txt);padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
@media (max-width:640px){
  .tb-stats{gap:8px;font-size:11px;order:3;width:100%;justify-content:space-between}
  .stat{font-size:10.5px}
  .tb-country{font-size:12px}
  #sidePanel{width:calc(100% - 16px);left:8px;top:auto;bottom:8px;max-height:44%}
  .mini-log{display:none}
  .start-head h1{font-size:21px}
  .country-list{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .grid2{grid-template-columns:1fr}
  .tabbtn{min-width:64px;font-size:10px}
  .map-hint{display:none}
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3746;border-radius:4px}
/* لودر نقشه */
#mapLoader{position:fixed;inset:0;background:rgba(4,7,11,.94);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
#mapLoader .box{background:var(--panel);border:2px dashed var(--gold);border-radius:14px;padding:28px 24px;max-width:460px;width:100%;text-align:center}
#mapLoader h2{font-size:18px;color:var(--gold);margin-bottom:10px}
#mapLoader p{font-size:12.5px;color:var(--dim);line-height:1.8;margin-bottom:18px}
#mapLoader label.btn{display:inline-block;cursor:pointer;font-size:14px;padding:11px 26px}
#mapLoader input[type=file]{display:none}
</style>
</head>
<body>

<div id="startScreen">
  <div class="start-head">
    <h1>⚔️ World at War</h1>
    <h2>فرمانروای جنگ</h2>
    <p class="sub">کشور خود را انتخاب کنید و سرنوشت جهان را رقم بزنید</p>
  </div>
  <div class="start-tools">
    <input id="countrySearch" type="text" placeholder="جستجوی کشور…" autocomplete="off">
    <button id="btnLoadSave" class="btn ghost">📂 ادامه بازی</button>
  </div>
  <div id="countryList" class="country-list"></div>
  <div class="start-foot">
    <span>نقشه: TopoJSON واقعی جهان • موتور: JavaScript خالص</span>
  </div>
</div>

<div id="game" class="hidden">
  <header id="topbar">
    <div class="tb-left">
      <button id="btnMenu" class="btn icon" title="منو">☰</button>
      <div id="tbCountry" class="tb-country"></div>
    </div>
    <div id="tbStats" class="tb-stats"></div>
    <div class="tb-right">
      <div id="tbDate" class="tb-date"></div>
      <div class="speed-group" id="speedGroup">
        <button data-sp="0" class="btn sp">⏸</button>
        <button data-sp="1" class="btn sp active">۱×</button>
        <button data-sp="2" class="btn sp">۲×</button>
        <button data-sp="5" class="btn sp">۵×</button>
        <button data-sp="10" class="btn sp">۱۰×</button>
      </div>
    </div>
  </header>
  <main id="mapWrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mapHint" class="map-hint">برای جابه‌جایی بکشید • با اسکرول بزرگ‌نمایی کنید</div>
    <aside id="sidePanel" class="hidden"></aside>
    <div id="miniLog" class="mini-log"></div>
  </main>
  <nav id="bottombar">
    <button class="tabbtn" data-tab="economy"><span>🏭</span>اقتصاد</button>
    <button class="tabbtn" data-tab="army"><span>🎖️</span>ارتش</button>
    <button class="tabbtn" data-tab="tech"><span>🔬</span>فناوری</button>
    <button class="tabbtn" data-tab="diplomacy"><span>🤝</span>دیپلماسی</button>
    <button class="tabbtn" data-tab="politics"><span>🏛️</span>سیاست</button>
    <button class="tabbtn" data-tab="log"><span>📜</span>رویدادها</button>
  </nav>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button id="modalClose" class="btn icon">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

function makeCountry(id,name){const m=MAJORS[name];let pop,gdp,ind,armyDiv;if(m){pop=m.pop;gdp=m.gdp;ind=m.ind;armyDiv=m.army;}else{const h=hashCode(name);pop=0.8+(h%90)+(h%7)/10;gdp=Math.max(2,pop*(0.4+(h%60)/12));ind=Math.max(1,Math.round(gdp/25));armyDiv=Math.max(1,Math.round(ind*0.4+pop*0.06));}const h2=hashCode(name+'res');const hue=hashCode(name)%360;return{id,name,fa:FA[name]||name,pop,gdp,ind,treasury:Math.max(10,Math.round(gdp*0.08)),taxRate:20,manpower:Math.round(pop*8),stability:60+(h2%30),army:{inf:Math.max(0,Math.round(armyDiv*0.60)),arm:Math.max(0,Math.round(armyDiv*0.20)),art:Math.max(0,Math.round(armyDiv*0.20)),air:Math.max(0,Math.round(armyDiv*0.10)),navy:Math.max(0,Math.round(armyDiv*0.10))},res:{oil:h2%100,steel:(h2>>3)%100,alu:(h2>>5)%100,coal:(h2>>7)%100,food:40+(h2>>9)%60},tech:{},research:null,queue:[],buildings:{},relations:{},atWar:[],allies:[],color:`hsl(${hue},42%,${30+(h2%22)}%)`,alive:true,defBonus:0,airCap:0};}

const MAP_W=1000,LAT_MAX=82,MY_MAX=Math.log(Math.tan(Math.PI/4+(LAT_MAX*Math.PI/180)/2)),MAP_H=MAP_W*(MY_MAX/Math.PI);
function proj(lon,lat){lat=clamp(lat,-LAT_MAX,LAT_MAX);const x=((lon+180)/360)*MAP_W;const my=Math.log(Math.tan(Math.PI/4+(lat*Math.PI)/360));const y=(0.5-my/(2*MY_MAX))*MAP_H;return[x,y];}
function decodeTopo(topo){const[sx,sy]=topo.transform.scale;const[tx,ty]=topo.transform.translate;const arcs=topo.arcs.map(arc=>{let x=0,y=0;return arc.map(p=>{x+=p[0];y+=p[1];return[x*sx+tx,y*sy+ty];});});function ring(idxs){const out=[];for(const i of idxs){const rev=i<0;const seg=arcs[rev?~i:i];const pts=rev?seg.slice().reverse():seg;for(let j=(out.length?1:0);j<pts.length;j++)out.push(pts[j]);}return out;}return{ring};}
function ringToPath(r){if(r.length<3)return '';let d='',prev=null,started=false;for(let i=0;i<r.length;i++){const lon=r[i][0],lat=r[i][1],p=proj(lon,lat);const jump=prev&&Math.abs(lon-prev[0])>180;if(!started||jump){d+='M'+p[0].toFixed(1)+' '+p[1].toFixed(1);started=true;}else{d+='L'+p[0].toFixed(1)+' '+p[1].toFixed(1);}prev=[lon,lat];}return d+'Z';}
const SVGNS='http://www.w3.org/2000/svg';
let svgEl,view={x:0,y:0,w:MAP_W,h:MAP_H};

function buildMap(){const topo=window.WORLD_TOPO;if(!topo)return false;const{ring}=decodeTopo(topo);svgEl=$('#map');svgEl.setAttribute('viewBox',`0 0 ${MAP_W} ${MAP_H}`);view={x:0,y:0,w:MAP_W,h:MAP_H};const geoms=topo.objects.countries.geometries;const frag=document.createDocumentFragment();const paths={};for(const g of geoms){const name=(g.properties&&g.properties.name)||'Unknown';if(name==='Antarctica')continue;const id=String(g.id||('x_'+name));const polys=[];if(g.type==='Polygon')polys.push(g.arcs.map(ring));else if(g.type==='MultiPolygon')g.arcs.forEach(p=>polys.push(p.map(ring)));let d='';for(const poly of polys)for(const r of poly)d+=ringToPath(r);if(!d)continue;const el=document.createElementNS(SVGNS,'path');el.setAttribute('d',d);el.setAttribute('class','country');el.setAttribute('data-id',id);el.setAttribute('fill-rule','evenodd');el.dataset.name=name;frag.appendChild(el);(paths[id]=paths[id]||[]).push(el);}svgEl.appendChild(frag);G.meta.paths=paths;G.meta.names={};for(const g of geoms){const nm=(g.properties&&g.properties.name)||'Unknown';const id=String(g.id||('x_'+nm));G.meta.names[id]=nm;}return true;}

function fillFor(id){const ownerId=G.owner[id]||id;const p=player();if(!p)return '#4a5563';if(ownerId===G.playerId)return '#2f6fd0';if(p.allies.includes(ownerId))return '#2e8b57';if(p.atWar.includes(ownerId))return '#b03030';const o=G.countries[ownerId];return o?o.color:'#4a5563';}
function updateColors(){if(!G.meta.paths)return;for(const id in G.meta.paths){const f=fillFor(id);for(const el of G.meta.paths[id])el.setAttribute('fill',f);}$$('#map .country.selected').forEach(e=>e.classList.remove('selected'));if(G.selected&&G.meta.paths[G.selected]){for(const el of G.meta.paths[G.selected])el.classList.add('selected');}}
function applyView(){svgEl.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);}
function zoomAt(factor,cx,cy){const nw=clamp(view.w*factor,25,MAP_W*1.2);const k=nw/view.w;const nh=view.h*k;view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.w=nw;view.h=nh;applyView();}
function setupMapInteraction(){const pointers=new Map();let lastDist=0,moved=0,downTime=0,startTarget=null;const toMap=(cx,cy)=>{const r=svgEl.getBoundingClientRect();return[view.x+((cx-r.left)/r.width)*view.w,view.y+((cy-r.top)/r.height)*view.h];};
svgEl.addEventListener('pointerdown',e=>{svgEl.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downTime=Date.now();startTarget=e.target;svgEl.classList.add('grabbing');if(pointers.size===2){const[a,b]=[...pointers.values()];lastDist=Math.hypot(a.x-b.x,a.y-b.y);}});
svgEl.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);const dx=e.clientX-prev.x,dy=e.clientY-prev.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved+=Math.abs(dx)+Math.abs(dy);if(pointers.size===1){const r=svgEl.getBoundingClientRect();view.x-=(dx/r.width)*view.w;view.y-=(dy/r.height)*view.h;applyView();}else if(pointers.size===2){const[a,b]=[...pointers.values()];const dist=Math.hypot(a.x-b.x,a.y-b.y);if(lastDist>0){const mid=toMap((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(lastDist/dist,mid[0],mid[1]);}lastDist=dist;}});
const end=e=>{pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0;if(pointers.size===0){svgEl.classList.remove('grabbing');const isClick=moved<9&&Date.now()-downTime<600;if(isClick&&startTarget){const el=startTarget.closest?startTarget.closest('.country'):null;if(el)selectCountry(el.getAttribute('data-id'));}startTarget=null;}};
svgEl.addEventListener('pointerup',end);svgEl.addEventListener('pointercancel',end);
svgEl.addEventListener('wheel',e=>{e.preventDefault();const m=toMap(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.18:0.85,m[0],m[1]);},{passive:false});}

function dailyIncome(c){const taxF=c.taxRate/20;let base=c.gdp*0.00035*taxF;base*=(1+(c.tech.ind||0)*0.05);base*=(1+(c.res.oil+c.res.steel)/500);base*=(0.7+c.stability/200);base*=(1+(c.buildings.port||0)*0.08);return base;}
function dailyExpense(c){const logBonus=1-(c.tech.log||0)*0.04;return(totalDiv(c)*0.012+(c.army.air+c.army.navy)*0.02)*Math.max(0.4,logBonus);}
function armyPower(c){const t=c.tech;return(c.army.inf*1.0*(1+(t.inf||0)*0.08)+c.army.arm*3.0*(1+(t.armor||0)*0.08)+c.army.art*2.0*(1+(t.arty||0)*0.08)+c.army.air*2.5*(1+(t.air||0)*0.08)+c.army.navy*1.5*(1+(t.navy||0)*0.08))*(0.6+c.stability/150);}
function economyPower(c){return c.gdp*0.6+c.ind*4+c.treasury;}
function countryRank(c){return Math.round(economyPower(c)*0.5+armyPower(c)*8);}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
function logEvent(msg){G.log.push({d:G.day,m:msg});if(G.log.length>250)G.log.shift();renderMiniLog();}
function renderMiniLog(){const box=$('#miniLog');if(!box)return;box.innerHTML=G.log.slice(-4).reverse().map(l=>`<div>${l.m}</div>`).join('');}
function dateStr(){const d=G.date;return`${fa(d.getDate())} ${MONTHS[d.getMonth()]} ${fa(d.getFullYear())}`;}
function rel(c,targetId){if(c.relations[targetId]===undefined)c.relations[targetId]=0;return c.relations[targetId];}
function setRel(a,b,v){a.relations[b.id]=clamp(v,-100,100);b.relations[a.id]=clamp(v,-100,100);}
function declareWar(a,b){if(a.atWar.includes(b.id))return;a.atWar.push(b.id);b.atWar.push(a.id);a.allies=a.allies.filter(x=>x!==b.id);b.allies=b.allies.filter(x=>x!==a.id);setRel(a,b,-100);logEvent(`⚔️ ${a.fa} به ${b.fa} اعلام جنگ کرد.`);for(const allyId of[...b.allies]){const al=G.countries[allyId];if(al&&al.alive&&!a.atWar.includes(allyId)){a.atWar.push(allyId);al.atWar.push(a.id);logEvent(`🤝 ${al.fa} به پشتیبانی از ${b.fa} وارد جنگ شد.`);}}updateColors();}
function makePeace(a,b){a.atWar=a.atWar.filter(x=>x!==b.id);b.atWar=b.atWar.filter(x=>x!==a.id);setRel(a,b,10);logEvent(`🕊️ صلح میان ${a.fa} و ${b.fa} برقرار شد.`);updateColors();}
function applyLosses(c,rate){for(const k of['inf','arm','art','air','navy'])c.army[k]=Math.max(0,Math.round(c.army[k]*(1-rate)));}
function resolveBattle(aId,dId,isPlayerAttack){const A=G.countries[aId],D=G.countries[dId];if(!A||!D||!D.alive)return null;const aPow=armyPower(A)*rnd(0.85,1.15);const dPow=armyPower(D)*(1.25+(D.defBonus||0))*rnd(0.85,1.15);const ratio=aPow/(aPow+dPow+0.001);const aLoss=clamp(0.28*(dPow/(aPow+1)),0.02,0.45);const dLoss=clamp(0.34*(aPow/(dPow+1)),0.03,0.60);const aBefore=totalDiv(A),dBefore=totalDiv(D);applyLosses(A,aLoss);applyLosses(D,dLoss);const win=ratio>0.5;const text=win?`✅ پیروزی ${A.fa} بر ${D.fa} — تلفات: ${fmt(aBefore-totalDiv(A))} لشکر در برابر ${fmt(dBefore-totalDiv(D))}`:`❌ شکست ${A.fa} از ${D.fa} — تلفات: ${fmt(aBefore-totalDiv(A))} لشکر در برابر ${fmt(dBefore-totalDiv(D))}`;if(isPlayerAttack)logEvent(text);else logEvent(`⚡ حمله ${A.fa} به ${D.fa} — ${win?'موفق':'دفع شد'}`);G.score+=win?5:1;if(totalDiv(D)<Math.max(1,dBefore*0.12)&&win){annex(A,D);}updateColors();return{win,aLoss,dLoss};}
function annex(winner,loser){for(const k in G.owner)if(G.owner[k]===loser.id)G.owner[k]=winner.id;G.owner[loser.id]=winner.id;winner.treasury+=loser.treasury*0.5;winner.gdp+=loser.gdp*0.30;winner.ind+=Math.round(loser.ind*0.30);winner.pop+=loser.pop*0.15;winner.manpower+=Math.round(loser.manpower*0.2);loser.alive=false;loser.treasury=0;winner.atWar=winner.atWar.filter(x=>x!==loser.id);winner.allies=winner.allies.filter(x=>x!==loser.id);logEvent(`🏴 ${loser.fa} توسط ${winner.fa} تصرف شد!`);G.score+=20;if(G.selected===loser.id)G.selected=winner.id;refreshSide();}
function techCost(c,k){const lv=c.tech[k]||0;return 180*(lv+1);}
function techDays(c,k){const lv=c.tech[k]||0;return Math.round((30+lv*18)*(1-(c.tech.com||0)*0.04));}

function loop(){if(!G.started||!G.running||G.speed===0)return;G.acc+=100*G.speed;let guard=0;while(G.acc>=DAY_MS&&guard++<40){G.acc-=DAY_MS;dayTick();}}
function dayTick(){G.day++;G.date=new Date(G.date.getTime()+86400000);const p=player();if(!p||!p.alive)return;const inc=dailyIncome(p),exp=dailyExpense(p);p.treasury+=inc-exp;if(p.treasury<0){p.treasury=0;p.stability=Math.max(0,p.stability-0.4);}p.manpower+=Math.max(0.5,p.pop*0.004);if(p.stability<100&&G.day%7===0)p.stability=Math.min(100,p.stability+0.4);for(let i=p.queue.length-1;i>=0;i--){const q=p.queue[i];q.daysLeft--;if(q.daysLeft<=0){completeBuilding(p,q);p.queue.splice(i,1);}}if(p.research){p.research.daysLeft--;if(p.research.daysLeft<=0){const k=p.research.branch;p.tech[k]=(p.tech[k]||0)+1;logEvent(`🔬 تحقیق «${branchName(k)}» به سطح ${fa(p.tech[k])} رسید.`);p.research=null;refreshModalIfOpen();}}if(G.day%5===0)aiTick();if(G.day%20===0&&Math.random()<0.55)randomEvent();refreshTop();if(G.selected)refreshSide();if(G.day%3===0)updateColors();}
function completeBuilding(c,q){c.buildings[q.k]=(c.buildings[q.k]||0)+1;switch(q.k){case'factory':c.ind+=5;c.gdp+=20;break;case'infra':c.gdp+=10;break;case'port':c.gdp+=6;break;case'airport':c.airCap=(c.airCap||0)+2;break;case'base':c.defBonus=(c.defBonus||0)+0.05;break;case'oilrig':c.res.oil=Math.min(100,c.res.oil+10);break;case'mine':c.res.steel=Math.min(100,c.res.steel+10);break;case'farm':c.res.food=Math.min(100,c.res.food+10);break;}logEvent(`🏗️ ساخت ${q.name} در ${c.fa} کامل شد.`);}

function aiTick(){const p=player();const ids=Object.keys(G.countries);for(const id of ids){const c=G.countries[id];if(!c.alive||id===G.playerId)continue;c.treasury+=dailyIncome(c)*0.9;if(c.treasury>90&&Math.random()<0.35){c.treasury-=25;c.army.inf+=1;if(c.manpower>20)c.manpower-=10;}if(Math.random()<0.15){const r=rel(c,G.playerId);setRel(c,p,r+(Math.random()<0.5?-1:1));}if(!c.atWar.includes(G.playerId)&&c.alive&&Math.random()<0.004){const myPow=armyPower(c),pPow=armyPower(p);if(myPow>pPow*1.35&&rel(c,G.playerId)<-20){declareWar(c,p);}}if(c.atWar.includes(G.playerId)&&Math.random()<0.14){resolveBattle(c.id,G.playerId,false);}if(Math.random()<0.0015&&c.atWar.length===0){const targets=ids.filter(t=>t!==id&&G.countries[t].alive&&t!==G.playerId);if(targets.length){const t=G.countries[targets[Math.floor(Math.random()*targets.length)]];if(armyPower(c)>armyPower(t)*1.6&&rel(c,t.id)<0){declareWar(c,t);G.pendingWars.push({a:c.id,b:t.id,days:20+Math.floor(Math.random()*20)});}}}}for(let i=G.pendingWars.length-1;i>=0;i--){const w=G.pendingWars[i];w.days--;const A=G.countries[w.a],B=G.countries[w.b];if(!A||!B||!A.alive||!B.alive){G.pendingWars.splice(i,1);continue;}if(w.days<=0){resolveBattle(A.id,B.id,false);G.pendingWars.splice(i,1);}}}

const EVENTS=[{w:3,run:p=>{const g=Math.round(p.gdp*0.02+20);p.treasury+=g;return`💰 کشف منابع جدید؛ ${fmt(g)} میلیارد دلار به خزانه افزوده شد.`;}},{w:3,run:p=>{const g=Math.round(p.gdp*0.02+15);p.treasury=Math.max(0,p.treasury-g);p.stability-=5;return`📉 بحران اقتصادی؛ ${fmt(g)} میلیارد دلار خسارت و افت ثبات.`;}},{w:2,run:p=>{p.stability=Math.max(0,p.stability-12);return`✊ اعتراضات خیابانی؛ ثبات کشور کاهش یافت.`;}},{w:2,run:p=>{p.stability=Math.min(100,p.stability+10);return`🎉 ثبات سیاسی بهبود یافت.`;}},{w:2,run:p=>{p.manpower+=Math.round(p.pop*0.5);return`🎖️ موج جدید داوطلبان؛ نیروی انسانی افزایش یافت.`;}},{w:1,run:p=>{p.res.oil=Math.min(100,p.res.oil+8);return`🛢️ کشف میدان نفتی جدید؛ منابع نفت افزایش یافت.`;}},{w:1,run:p=>{const g=Math.round(40+p.gdp*0.01);if(p.treasury>=g){p.treasury-=g;p.tech.ind=Math.min(MAX_TECH,(p.tech.ind||0)+1);}return`🏭 قرارداد صنعتی خارجی؛ سطح صنعت ارتقا یافت.`;}},{w:1,run:p=>{p.gdp=Math.round(p.gdp*1.02);return`📈 رشد اقتصادی مطلوب؛ تولید ناخالص افزایش یافت.`;}},{w:1,run:p=>{for(const k in p.relations)p.relations[k]=clamp(p.relations[k]+3,-100,100);return`🕊️ فضای دیپلماتیک مثبت؛ روابط جهانی بهبود یافت.`;}}];
function randomEvent(){const p=player();if(!p)return;const total=EVENTS.reduce((s,e)=>s+e.w,0);let r=Math.random()*total;for(const e of EVENTS){r-=e.w;if(r<=0){logEvent('📰 '+e.run(p));break;}}}

function flagOf(name){const iso=ISO2[name];if(!iso||iso==='xk'){const c=Object.values(G.countries).find(x=>x.name===name);return`<span class="c-flag-fallback" style="background:${c?c.color:'#555'}"></span>`;}return iso.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));}

function refreshTop(){const p=player();if(!p)return;const inc=dailyIncome(p),exp=dailyExpense(p),net=inc-exp;$('#tbCountry').innerHTML=`${flagOf(p.name)} <span>${p.fa}</span>`;$('#tbStats').innerHTML=`<div class="stat"><span>💰</span><b>${fmt(p.treasury)}</b></div><div class="stat ${net>=0?'good':'bad'}"><span>📊</span><b>${net>=0?'+':''}${fmt(net)}</b></div><div class="stat"><span>👥</span><b>${fmt(p.manpower)}</b></div><div class="stat"><span>🏭</span><b>${fmt(p.ind)}</b></div><div class="stat"><span>🎖️</span><b>${fmt(totalDiv(p))}</b></div><div class="stat ${p.stability<40?'bad':''}"><span>⚖️</span><b>${fmt(p.stability)}٪</b></div><div class="stat"><span>⭐</span><b>${fmt(G.score)}</b></div>`;$('#tbDate').textContent=dateStr();}

function selectCountry(id){G.selected=id;updateColors();refreshSide();$('#sidePanel').classList.remove('hidden');}
function refreshSide(){const panel=$('#sidePanel');if(!G.selected){panel.classList.add('hidden');return;}const p=player();const c=G.countries[G.selected];if(!p||!c){panel.classList.add('hidden');return;}const ownerId=G.owner[c.id]||c.id;const owner=G.countries[ownerId];const isSelf=ownerId===G.playerId;const isWar=p.atWar.includes(ownerId);const isAlly=p.allies.includes(ownerId);const alive=owner&&owner.alive;let badge='<span class="badge neutral">بی‌طرف</span>';if(isSelf)badge='<span class="badge ally">کشور شما</span>';else if(isWar)badge='<span class="badge war">در جنگ</span>';else if(isAlly)badge='<span class="badge ally">متحد</span>';let actions='';if(!isSelf&&alive){actions=`<button class="btn ${isWar?'red':''}" data-act="war" data-id="${ownerId}">${isWar?'⚔️ حمله':'📢 اعلام جنگ'}</button>${isWar?`<button class="btn green" data-act="peace" data-id="${ownerId}">🕊️ صلح</button>`:''}${!isWar&&!isAlly?`<button class="btn blue" data-act="ally" data-id="${ownerId}">🤝 اتحاد</button>`:''}<button class="btn" data-act="improve" data-id="${ownerId}">💬 بهبود</button><button class="btn" data-act="sanction" data-id="${ownerId}">🚫 تحریم</button>`;}panel.innerHTML=`<div class="sp-head"><div class="flag">${flagOf(owner?owner.name:c.name)}</div><h4>${owner?owner.fa:c.fa} ${badge}<small>${owner?owner.name:c.name}${!alive?' — تصرف‌شده':''}</small></h4></div>${owner?`<div class="sp-row"><span>جمعیت</span><b>${fmt(owner.pop)} م</b></div><div class="sp-row"><span>GDP</span><b>${fmt(owner.gdp)}</b></div><div class="sp-row"><span>صنعت</span><b>${fmt(owner.ind)}</b></div><div class="sp-row"><span>لشکرها</span><b>${fmt(totalDiv(owner))}</b></div><div class="sp-row"><span>هوایی</span><b>${fmt(owner.army.air)}</b></div><div class="sp-row"><span>دریایی</span><b>${fmt(owner.army.navy)}</b></div><div class="sp-row"><span>قدرت نظامی</span><b>${fmt(Math.round(armyPower(owner)))}</b></div><div class="sp-row"><span>روابط</span><b>${fmt(rel(p,ownerId))}</b></div>${isWar?`<div class="sp-row"><span>وضعیت</span><b style="color:#e05a48">در جنگ با شما</b></div>`:''}`:''}<div class="sp-actions">${actions}</div>`;}

function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden');G.running=false;}
function closeModal(){$('#modal').classList.add('hidden');G.running=G.speed>0;}
let currentTab=null;
function refreshModalIfOpen(){if($('#modal').classList.contains('hidden'))return;if(currentTab)openTab(currentTab,true);}
function openTab(tab,silent){currentTab=tab;const p=player();let title='',html='';switch(tab){case'economy':title='🏭 اقتصاد و تولید';html=renderEconomy(p);break;case'army':title='🎖️ ارتش و جنگ';html=renderArmy(p);break;case'tech':title='🔬 درخت فناوری';html=renderTech(p);break;case'diplomacy':title='🤝 دیپلماسی';html=renderDiplomacy(p);break;case'politics':title='🏛️ سیاست داخلی';html=renderPolitics(p);break;case'log':title='📜 رویدادها و گزارش';html=renderLog();break;}if(silent){$('#modalBody').innerHTML=html;}else{openModal(title,html);}}

function renderEconomy(p){const inc=dailyIncome(p),exp=dailyExpense(p),net=inc-exp;const buildCards=BUILDINGS.map(b=>`<div class="card"><h5>${b.icon} ${b.name}</h5><p>${b.eff}<br>هزینه: ${fmt(b.cost)} • زمان: ${fa(b.days)} روز</p><div style="margin-top:7px"><button class="btn small gold" data-act="build" data-k="${b.k}" ${p.treasury<b.cost?'disabled':''}>ساخت</button></div></div>`).join('');const queueHtml=p.queue.length?p.queue.map(q=>`<div class="list-item"><div class="li-name">${q.icon} ${q.name}</div><div class="tag">${fa(q.daysLeft)} روز</div></div>`).join(''):'<div class="empty">صف ساخت خالی است</div>';const resRows=['oil','steel','alu','coal','food'].map(k=>{const label={oil:'نفت',steel:'فولاد',alu:'آلومینیوم',coal:'زغال‌سنگ',food:'غذا'}[k];return`<div class="kv"><span>${label}</span><b>${fmt(p.res[k])}</b><div class="bar" style="width:100px"><i style="width:${p.res[k]}%"></i></div></div>`;}).join('');return`<div class="sec"><div class="sec-title">خلاصه مالی</div><div class="grid2"><div class="card"><div class="kv"><span>خزانه</span><b>${fmt(p.treasury)}</b></div><div class="kv"><span>درآمد روزانه</span><b style="color:#4ecb85">+${fmt(inc)}</b></div><div class="kv"><span>هزینه روزانه</span><b style="color:#e05a48">-${fmt(exp)}</b></div><div class="kv"><span>تراز</span><b style="color:${net>=0?'#4ecb85':'#e05a48'}">${net>=0?'+':''}${fmt(net)}</b></div></div><div class="card"><div class="kv"><span>GDP</span><b>${fmt(p.gdp)}</b></div><div class="kv"><span>صنعت</span><b>${fmt(p.ind)}</b></div><div class="kv"><span>مالیات</span><b>${fmt(p.taxRate)}٪</b></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn small" data-act="tax" data-v="-5">−۵٪</button><button class="btn small" data-act="tax" data-v="5">+۵٪</button></div></div></div></div><div class="sec"><div class="sec-title">منابع طبیعی</div><div class="card">${resRows}</div></div><div class="sec"><div class="sec-title">صف ساخت</div>${queueHtml}</div><div class="sec"><div class="sec-title">ساخت و ساز</div><div class="grid3">${buildCards}</div></div>`;}

function renderArmy(p){const enemies=p.atWar.map(id=>G.countries[id]).filter(c=>c&&c.alive);const enemyHtml=enemies.length?enemies.map(e=>`<div class="list-item"><div class="li-name">${flagOf(e.name)} ${e.fa}</div><div class="tag">قدرت: ${fmt(Math.round(armyPower(e)))}</div><button class="btn small red" data-act="attack" data-id="${e.id}">حمله</button></div>`).join(''):'<div class="empty">در حال حاضر با کسی در جنگ نیستید</div>';return`<div class="sec"><div class="sec-title">نیروهای مسلح</div><div class="grid2"><div class="card"><div class="kv"><span>پیاده‌نظام</span><b>${fmt(p.army.inf)}</b></div><div class="kv"><span>زرهی</span><b>${fmt(p.army.arm)}</b></div><div class="kv"><span>توپخانه</span><b>${fmt(p.army.art)}</b></div></div><div class="card"><div class="kv"><span>هوایی</span><b>${fmt(p.army.air)}</b></div><div class="kv"><span>دریایی</span><b>${fmt(p.army.navy)}</b></div><div class="kv"><span>قدرت کل</span><b style="color:#ffd54a">${fmt(Math.round(armyPower(p)))}</b></div></div></div></div><div class="sec"><div class="sec-title">استخدام</div><div class="grid3"><div class="card"><h5>🔫 پیاده</h5><p>۲۵ • ۱۰ نفر</p><button class="btn small gold" data-act="recruit" data-k="inf" data-cost="25" data-mp="10">استخدام</button></div><div class="card"><h5>🛡️ زرهی</h5><p>۶۰ • ۸ نفر</p><button class="btn small gold" data-act="recruit" data-k="arm" data-cost="60" data-mp="8">استخدام</button></div><div class="card"><h5>💥 توپخانه</h5><p>۴۰ • ۶ نفر</p><button class="btn small gold" data-act="recruit" data-k="art" data-cost="40" data-mp="6">استخدام</button></div><div class="card"><h5>✈️ هوایی</h5><p>۸۰ • ۵ نفر</p><button class="btn small gold" data-act="recruit" data-k="air" data-cost="80" data-mp="5">استخدام</button></div><div class="card"><h5>🚢 دریایی</h5><p>۱۲۰ • ۸ نفر</p><button class="btn small gold" data-act="recruit" data-k="navy" data-cost="120" data-mp="8">استخدام</button></div></div></div><div class="sec"><div class="sec-title">جبهه‌های فعال</div>${enemyHtml}</div>`;}

function renderTech(p){const items=BRANCHES.map(b=>{const lv=p.tech[b.key]||0;const maxed=lv>=MAX_TECH;const cost=techCost(p,b.key),days=techDays(p,b.key);const isResearching=p.research&&p.research.branch===b.key;let btn='';if(maxed)btn='<span class="tag">تکمیل</span>';else if(isResearching)btn=`<span class="tag">⏳ ${fa(p.research.daysLeft)} روز</span>`;else if(p.research)btn='<span class="tag">مشغول</span>';else btn=`<button class="btn small gold" data-act="research" data-k="${b.key}" ${p.treasury<cost?'disabled':''}>تحقیق (${fmt(cost)})</button>`;return`<div class="tech-item"><div class="ti-icon">${b.icon}</div><div class="ti-main"><div class="ti-name">${b.name}</div><div class="ti-sub">${b.eff} • ${fa(days)} روز</div><div class="lvl">${Array.from({length:MAX_TECH},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>${btn}</div>`;}).join('');return`<div class="sec"><div class="sec-title">آزمایشگاه ملی</div>${items}</div>`;}

function renderDiplomacy(p){const others=Object.values(G.countries).filter(c=>c.alive&&c.id!==p.id).sort((a,b)=>armyPower(b)-armyPower(a)).slice(0,40);const rows=others.map(c=>{const r=rel(p,c.id);const war=p.atWar.includes(c.id);const ally=p.allies.includes(c.id);return`<div class="list-item"><div class="li-name">${flagOf(c.name)} ${c.fa}</div><div class="tag" style="color:${r>30?'#6fdb9d':r<-30?'#ff8b7d':'#9fb3c9'}">${fmt(r)}</div>${war?'<span class="tag" style="background:#4a1a15;color:#ff8b7d">جنگ</span>':''}${ally?'<span class="tag" style="background:#12361f;color:#6fdb9d">متحد</span>':''}<button class="btn small" data-act="improve" data-id="${c.id}">💬</button>${!war?`<button class="btn small red" data-act="war" data-id="${c.id}">⚔️</button>`:`<button class="btn small green" data-act="peace" data-id="${c.id}">🕊️</button>`}</div>`;}).join('');return`<div class="sec"><div class="sec-title">وضعیت روابط</div><div class="card"><div class="kv"><span>متحدان</span><b>${p.allies.length||'—'}</b></div><div class="kv"><span>در جنگ</span><b>${p.atWar.length||'—'}</b></div></div></div><div class="sec"><div class="sec-title">کشورهای قدرتمند</div>${rows}</div>`;}

function renderPolitics(p){const policies=[{k:'tax',name:'افزایش مالیات',eff:'+۵٪ مالیات، -۵ ثبات'},{k:'welfare',name:'برنامه رفاهی',eff:'+۸ ثبات، هزینه ۶۰'},{k:'propaganda',name:'تبلیغات دولتی',eff:'+۵ ثبات، -۲ روابط'},{k:'mobilize',name:'بسیج عمومی',eff:'+۱۰۰ نیرو، -۳ ثبات'},{k:'invest',name:'سرمایه‌گذاری صنعتی',eff:'+۱۰ صنعت، هزینه ۱۰۰'},{k:'trade',name:'توافق تجاری',eff:'+۴٪ GDP، هزینه ۵۰'}];const cards=policies.map(pc=>`<div class="card"><h5>${pc.name}</h5><p>${pc.eff}</p><div style="margin-top:7px"><button class="btn small gold" data-act="policy" data-k="${pc.k}">اجرا</button></div></div>`).join('');return`<div class="sec"><div class="sec-title">وضعیت کشور</div><div class="card"><div class="kv"><span>ثبات سیاسی</span><b>${fmt(p.stability)}٪</b><div class="bar y" style="width:100px"><i style="width:${p.stability}%"></i></div></div><div class="kv"><span>نیروی انسانی</span><b>${fmt(p.manpower)}</b></div><div class="kv"><span>امتیاز</span><b>⭐ ${fmt(G.score)}</b></div><div class="kv"><span>روز</span><b>${fa(G.day)}</b></div></div></div><div class="sec"><div class="sec-title">سیاست‌ها</div><div class="grid2">${cards}</div></div>`;}

function renderLog(){const rows=G.log.slice(-80).reverse().map(l=>`<div class="list-item"><div class="li-name">${l.m}</div><div class="tag">روز ${fa(l.d)}</div></div>`).join('');return`<div class="sec"><div class="sec-title">گزارش رویدادها</div>${rows||'<div class="empty">هنوز رویدادی ثبت نشده</div>'}</div>`;}

const ACTIONS={build(btn){const p=player();const b=BUILDINGS.find(x=>x.k===btn.dataset.k);if(!b||p.treasury<b.cost)return toast('خزانه کافی نیست');p.treasury-=b.cost;p.queue.push({k:b.k,name:b.name,icon:b.icon,daysLeft:b.days});toast(`${b.name} به صف ساخت اضافه شد`);openTab('economy',true);refreshTop();},tax(btn){const p=player();p.taxRate=clamp(p.taxRate+Number(btn.dataset.v),5,60);openTab('economy',true);refreshTop();},recruit(btn){const p=player();const k=btn.dataset.k,cost=Number(btn.dataset.cost),mp=Number(btn.dataset.mp);if(p.treasury<cost)return toast('خزانه کافی نیست');if(p.manpower<mp)return toast('نیروی انسانی کافی نیست');p.treasury-=cost;p.manpower-=mp;p.army[k]+=1;toast('نیرو اضافه شد');openTab('army',true);refreshTop();},research(btn){const p=player();const k=btn.dataset.k;if(p.research)return toast('یک تحقیق در جریان است');const cost=techCost(p,k);if(p.treasury<cost)return toast('خزانه کافی نیست');p.treasury-=cost;p.research={branch:k,daysLeft:techDays(p,k)};logEvent(`🔬 تحقیق روی «${branchName(k)}» آغاز شد.`);openTab('tech',true);refreshTop();},policy(btn){const p=player();const map={tax:c=>{c.taxRate=clamp(c.taxRate+5,5,60);c.stability-=5;},welfare:c=>{if(c.treasury<60)return false;c.treasury-=60;c.stability=Math.min(100,c.stability+8);},propaganda:c=>{c.stability=Math.min(100,c.stability+5);for(const k in c.relations)c.relations[k]-=2;},mobilize:c=>{c.manpower+=100;c.stability-=3;},invest:c=>{if(c.treasury<100)return false;c.treasury-=100;c.ind+=10;c.gdp+=30;},trade:c=>{if(c.treasury<50)return false;c.treasury-=50;c.gdp=Math.round(c.gdp*1.04);}};const fn=map[btn.dataset.k];if(fn&&fn(p)===false)return toast('خزانه کافی نیست');toast('سیاست اجرا شد');openTab('politics',true);refreshTop();refreshSide();},war(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t||!t.alive||t.id===p.id)return;declareWar(p,t);toast(`به ${t.fa} اعلام جنگ شد`);refreshSide();openTab('diplomacy',true);},attack(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t||!t.alive)return;if(!p.atWar.includes(t.id))declareWar(p,t);resolveBattle(p.id,t.id,true);toast('نبرد انجام شد');openTab('army',true);refreshSide();refreshTop();},peace(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t)return;const myPow=armyPower(p),tPow=armyPower(t);if(tPow<myPow*0.9||totalDiv(t)<3||Math.random()<0.4){makePeace(p,t);toast(`${t.fa} صلح را پذیرفت`);}else{setRel(p,t,rel(p,t.id)+5);toast(`${t.fa} صلح را رد کرد`);}refreshSide();openTab('diplomacy',true);},ally(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t)return;const r=rel(p,t.id);if(r<40){toast(`روابط کافی نیست (${fmt(r)}/۴۰)`);return;}if(Math.random()<r/130){p.allies.push(t.id);t.allies.push(p.id);setRel(p,t,Math.min(100,r+15));logEvent(`🤝 ${p.fa} و ${t.fa} متحد شدند.`);toast('اتحاد برقرار شد');}else{toast(`${t.fa} رد کرد`);}refreshSide();updateColors();},improve(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t)return;if(p.treasury<5)return toast('خزانه کافی نیست');p.treasury-=5;setRel(p,t,rel(p,t.id)+6);toast(`روابط با ${t.fa} بهبود یافت`);refreshSide();if(currentTab==='diplomacy')openTab('diplomacy',true);},sanction(btn){const p=player();const t=G.countries[btn.dataset.id];if(!t)return;setRel(p,t,rel(p,t.id)-15);t.gdp=Math.max(5,Math.round(t.gdp*0.97));logEvent(`🚫 ${p.fa} ${t.fa} را تحریم کرد.`);toast('تحریم اعمال شد');refreshSide();},newgame(){if(!confirm('بازی جدید؟ پیشرفت فعلی از بین می‌رود.'))return;localStorage.removeItem('waw_save_v1');location.reload();},export(){exportSave();},importBtn(){$('#importFile').click();}};

document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const fn=ACTIONS[btn.dataset.act];if(fn){e.preventDefault();fn(btn);}});

const SAVE_KEY='waw_save_v1';
function serialize(){return JSON.stringify({v:1,day:G.day,date:G.date.getTime(),playerId:G.playerId,countries:G.countries,owner:G.owner,log:G.log,pendingWars:G.pendingWars,score:G.score,speed:G.speed});}
function saveGame(){try{localStorage.setItem(SAVE_KEY,serialize());}catch(e){toast('خطا در ذخیره');}}
function loadFrom(data){const d=JSON.parse(data);G.day=d.day;G.date=new Date(d.date);G.playerId=d.playerId;G.countries=d.countries;G.owner=d.owner;G.log=d.log||[];G.pendingWars=d.pendingWars||[];G.score=d.score||0;G.speed=d.speed||1;G.selected=null;G.started=true;startGameUI();updateColors();refreshTop();renderMiniLog();toast('بازی بارگذاری شد');}
function loadGame(){const raw=localStorage.getItem(SAVE_KEY);if(!raw)return toast('ذخیره‌ای یافت نشد');loadFrom(raw);}
function exportSave(){const blob=new Blob([serialize()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`world-at-war-save-${G.day}.json`;a.click();URL.revokeObjectURL(a.href);}

function startGameUI(){$('#startScreen').classList.add('hidden');$('#game').classList.remove('hidden');refreshTop();refreshSide();}
function initGame(countryId){G.playerId=countryId;G.started=true;G.running=true;G.speed=1;G.acc=0;G.day=0;G.date=new Date(2024,0,1);G.log=[];G.pendingWars=[];G.score=0;for(const id in G.countries)G.owner[id]=id;logEvent(`🎬 بازی با ${G.countries[countryId].fa} آغاز شد.`);updateColors();startGameUI();document.querySelector('.btn.sp.active')?.classList.remove('active');document.querySelector('.btn.sp[data-sp="1"]').classList.add('active');}

function buildCountryList(){const list=$('#countryList');const items=Object.values(G.countries).sort((a,b)=>countryRank(b)-countryRank(a));const render=filter=>{const f=(filter||'').trim().toLowerCase();const rows=items.filter(c=>!f||c.fa.includes(f)||c.name.toLowerCase().includes(f)).map(c=>`<div class="c-item" data-id="${c.id}"><span class="c-flag">${flagOf(c.name)}</span><div><div class="c-name">${c.fa}</div><div class="c-meta">جمعیت ${fmt(c.pop)}م • ارتش ${fmt(totalDiv(c))}</div></div></div>`).join('');list.innerHTML=rows||'<div class="empty">کشوری یافت نشد</div>';};render('');$('#countrySearch').addEventListener('input',e=>render(e.target.value));list.addEventListener('click',e=>{const it=e.target.closest('.c-item');if(!it)return;initGame(it.dataset.id);});}

function showMapLoader(){const d=document.createElement('div');d.id='mapLoader';d.innerHTML=`<div class="box"><h2>📂 بارگذاری نقشه جهان</h2><p>بارگذاری خودکار نقشه انجام نشد. می‌توانید یک فایل TopoJSON سازگار انتخاب کنید.</p><label class="btn gold">📁 انتخاب فایل نقشه<input type="file" id="mapFileInput" accept=".txt,.json"></label></div>`;document.body.appendChild(d);$('#mapFileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(fr.result);window.WORLD_TOPO=data;localStorage.setItem('waw_map',fr.result);d.remove();if(!boot()){toast('نقشه نامعتبر');location.reload();}}catch(err){toast('فایل JSON نامعتبر');}};fr.readAsText(f);});}

function boot(){if(!window.WORLD_TOPO){const cached=localStorage.getItem('waw_map');if(cached){try{window.WORLD_TOPO=JSON.parse(cached);}catch(e){localStorage.removeItem('waw_map');}}}if(!window.WORLD_TOPO){showMapLoader();return false;}if(!buildMap())return false;for(const id in G.meta.names){const name=G.meta.names[id];if(name==='Antarctica')continue;G.countries[id]=makeCountry(id,name);G.owner[id]=id;}setupMapInteraction();buildCountryList();$('#speedGroup').addEventListener('click',e=>{const b=e.target.closest('.btn.sp');if(!b)return;$$('#speedGroup .btn.sp').forEach(x=>x.classList.remove('active'));b.classList.add('active');G.speed=Number(b.dataset.sp);G.running=G.speed>0;});$$('.tabbtn').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));$('#modalClose').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});$('#btnMenu').addEventListener('click',()=>{openModal('⚙️ منو',`<div class="grid2"><button class="btn" data-act="export">⬇️ خروجی JSON</button><button class="btn" data-act="importBtn">⬆️ ورود از فایل</button><button class="btn red" data-act="newgame" style="grid-column:1/-1">🔄 بازی جدید</button></div><input type="file" id="importFile" accept=".json" style="display:none"><div class="sec" style="margin-top:16px"><div class="sec-title">راهنما</div><div class="card"><p>• کشورها را روی نقشه لمس کنید.<br>• با اسکرول بزرگ‌نمایی کنید.<br>• اقتصاد: ساختمان و مالیات.<br>• ارتش: استخدام و حمله.<br>• با نابودی دشمن، سرزمینش تصرف می‌شود.<br>• بازی هر ۳۰ ثانیه ذخیره می‌شود.</p></div></div>`);setTimeout(()=>{const f=$('#importFile');if(f)f.addEventListener('change',ev=>{const file=ev.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{loadFrom(fr.result);closeModal();}catch(err){toast('فایل نامعتبر');}};fr.readAsText(file);});},30);});$('#btnLoadSave').addEventListener('click',()=>{if(!localStorage.getItem(SAVE_KEY))return toast('ذخیره‌ای یافت نشد');loadGame();});setInterval(()=>{if(G.started)saveGame();},30000);setInterval(loop,100);document.addEventListener('gesturestart',e=>e.preventDefault());return true;}

document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
